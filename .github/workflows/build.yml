# Version: 10
# Changelog:
# - Se añadió el clonado del repositorio de Vendor (proprietary_vendor_motorola) para solucionar el error de soong_namespace.
# - Se ajustó la ruta del vendor a vendor/motorola para que coincida con las dependencias de msm8937-common.
# - Se mantiene el uso de cache y CCACHE para máxima velocidad.
# - Se fusionan todos los pasos de compilación en un bloque único para evitar pérdida de variables de entorno.
# - Se mantiene la configuración de Android Go (Low RAM) para pettyl.

name: LineageOS 17.1 Build - Pettyl (Turbo Mode)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximizar Espacio en Disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /etc/apt/sources.list.d/*

      - name: Instalar Herramientas de Compilación
        run: |
          sudo apt update
          sudo apt install -y bc build-essential zip curl libstdc++6 git wget \
          libssl-dev libxml2-utils flex bison gperf libncurses5-dev squashfs-tools \
          schedtool libgl1-mesa-dev g++-multilib gcc-multilib lib32ncurses5-dev \
          lib32readline-dev lib32z1-dev zlib1g-dev openjdk-8-jdk python-is-python3 ccache || true
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Configurar Cache de Repo
        uses: actions/cache@v3
        with:
          path: |
            ~/.ccache
            lineage/.repo
          key: ${{ runner.os }}-repo-lineage-17.1-${{ hashFiles('lineage/.repo/manifests/default.xml') }}
          restore-keys: |
            ${{ runner.os }}-repo-lineage-17.1-

      - name: Instalar Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sincronizar LineageOS (Fast Sync)
        run: |
          mkdir -p lineage && cd lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Checkout Device Tree
        uses: actions/checkout@v3
        with:
          path: lineage/device/motorola/pettyl

      - name: Clonar Dependencias (MSM8937-Common & Vendor)
        run: |
          cd lineage
          # Clonar el árbol común del dispositivo
          git clone https://github.com/LineageOS/android_device_motorola_msm8937-common -b lineage-17.1 device/motorola/msm8937-common --depth=1
          
          # Clonar el repositorio de VENDOR (el que me pasaste)
          # Se clona en vendor/motorola para que las rutas internas coincidan
          git clone https://github.com/elmendezz/proprietary_vendor_motorola -b lineage-17.1 vendor/motorola --depth=1

      - name: Compilar LineageOS (The Moment of Truth)
        run: |
          cd lineage
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          
          export ALLOW_MISSING_DEPENDENCIES=true
          
          source build/envsetup.sh
          # lunch ahora encontrará el vendor y el soong_namespace
          lunch lineage_pettyl-userdebug
          
          mka bacon -j$(nproc --all)
