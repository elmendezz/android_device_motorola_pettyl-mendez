# Version: 9
# Changelog:
# - Se añadió actions/cache para persistir la carpeta .repo y reducir el tiempo de sync al mínimo.
# - Se implementó CCACHE para acelerar la compilación en ejecuciones sucesivas.
# - Se mantiene la optimización de Shallow Clone (depth=1) de la V7.
# - Se corrigió el error 'mka: command not found' fusionando los pasos de preparación y compilación en un solo bloque 'run'.
# - Se asegura que envsetup.sh y lunch se ejecuten en la misma sesión de shell que mka bacon.
# - Se mantienen todas las correcciones previas para pettyl (Android Go / Low RAM).

name: LineageOS 17.1 Build - Pettyl (Turbo Mode)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximizar Espacio en Disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /etc/apt/sources.list.d/*

      - name: Instalar Herramientas de Compilación
        run: |
          sudo apt update
          sudo apt install -y bc build-essential zip curl libstdc++6 git wget \
          libssl-dev libxml2-utils flex bison gperf libncurses5-dev squashfs-tools \
          schedtool libgl1-mesa-dev g++-multilib gcc-multilib lib32ncurses5-dev \
          lib32readline-dev lib32z1-dev zlib1g-dev openjdk-8-jdk python-is-python3 ccache || true
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Configurar Cache de Repo
        uses: actions/cache@v3
        with:
          path: |
            ~/.ccache
            lineage/.repo
          key: ${{ runner.os }}-repo-lineage-17.1-${{ hashFiles('lineage/.repo/manifests/default.xml') }}
          restore-keys: |
            ${{ runner.os }}-repo-lineage-17.1-

      - name: Instalar Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sincronizar LineageOS (Fast Sync)
        run: |
          mkdir -p lineage && cd lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Checkout Device Tree
        uses: actions/checkout@v3
        with:
          path: lineage/device/motorola/pettyl

      - name: Clonar Dependencias (msm8937-common)
        run: |
          cd lineage
          git clone https://github.com/LineageOS/android_device_motorola_msm8937-common -b lineage-17.1 device/motorola/msm8937-common --depth=1

      - name: Compilar LineageOS (Todo en uno)
        run: |
          cd lineage
          # Configurar CCACHE para que no empiece de cero si repites
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          
          # Variables de entorno críticas
          export ALLOW_MISSING_DEPENDENCIES=true
          
          # ¡AQUÍ ESTÁ EL TRUCO! Todo en la misma sesión de shell
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
          # Empezar la magia
          mka bacon -j$(nproc --all)
