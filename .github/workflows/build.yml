# Version: 4
# Changelog:
# - Se corrigió el nombre del paquete python-is-python3.
# - Se añadió un paso manual para el symlink de python si falla el paquete.
# - Se optimizó la instalación de dependencias para evitar errores de mirror.
# - Se mantiene la configuración para pettyl (Moto E5 Play Go).
# - Se corrigió la ruta del Checkout para que el Device Tree quede dentro de la carpeta del source.
# - Se añadió la creación de la carpeta lineage antes del checkout para evitar conflictos de rutas.

name: LineageOS 17.1 Build - Pettyl
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar Herramientas de Compilación
        run: |
          sudo apt update
          sudo apt install -y bc build-essential zip curl libstdc++6 git wget \
          libssl-dev libxml2-utils flex bison gperf libncurses5-dev squashfs-tools \
          schedtool libgl1-mesa-dev g++-multilib gcc-multilib lib32ncurses5-dev \
          lib32readline-dev lib32z1-dev zlib1g-dev openjdk-8-jdk python-is-python3 || true
          
          # Asegurar que python existe aunque falle el paquete anterior
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Instalar Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sincronizar LineageOS (Thin Sync)
        run: |
          mkdir lineage && cd lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          
      - name: Checkout Device Tree
        uses: actions/checkout@v3
        with:
          # IMPORTANTE: Ahora se descarga dentro de la estructura de carpetas de Lineage
          path: lineage/device/motorola/pettyl

      - name: Clonar Dependencias (msm8937-common)
        run: |
          cd lineage
          # Clonamos el common que necesita tu pettyl
          git clone https://github.com/LineageOS/android_device_motorola_msm8937-common -b lineage-17.1 device/motorola/msm8937-common --depth=1

      - name: Preparar Compilación
        run: |
          cd lineage
          source build/envsetup.sh
          # Ahora lunch sí debería encontrar los archivos en device/motorola/pettyl
          lunch lineage_pettyl-userdebug
          
      - name: ¡Mka Bacon! (Compilar)
        run: |
          cd lineage
          export ALLOW_MISSING_DEPENDENCIES=true
          mka bacon -j$(nproc --all)
