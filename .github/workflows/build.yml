# Version: 7
# Changelog:
# - Optimización agresiva de repo sync (Thin Sync + Depth 1).
# - Se añadieron las flags --no-tags y --current-branch para reducir descarga.
# - Se ajustó el número de hilos de repo sync a 4 para mayor estabilidad en GHA.
# - Se mantiene la ruta corregida para pettyl (Moto E5 Play).
# - Se incluye el fix de PRODUCT_IS_LOW_RAM en el flujo lógico.

name: LineageOS 17.1 Build - Pettyl
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar Herramientas de Compilación
        run: |
          sudo apt update
          sudo apt install -y bc build-essential zip curl libstdc++6 git wget \
          libssl-dev libxml2-utils flex bison gperf libncurses5-dev squashfs-tools \
          schedtool libgl1-mesa-dev g++-multilib gcc-multilib lib32ncurses5-dev \
          lib32readline-dev lib32z1-dev zlib1g-dev openjdk-8-jdk python-is-python3 || true
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Instalar Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sincronizar LineageOS (Super Fast Sync)
        run: |
          mkdir lineage && cd lineage
          # --depth=1: Solo trae el último commit, no todo el historial (Ahorra GBs)
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          
          # Flags optimizadas:
          # -c: Solo la rama actual
          # -j4: 4 hilos (más estable en GHA para evitar desconexiones)
          # --no-tags: No descarga etiquetas innecesarias
          # --no-clone-bundle: Salta optimizaciones de bundle que a veces fallan
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Checkout Device Tree
        uses: actions/checkout@v3
        with:
          path: lineage/device/motorola/pettyl

      - name: Clonar Dependencias (msm8937-common)
        run: |
          cd lineage
          # También usamos --depth=1 aquí
          git clone https://github.com/LineageOS/android_device_motorola_msm8937-common -b lineage-17.1 device/motorola/msm8937-common --depth=1

      - name: Preparar Compilación
        run: |
          cd lineage
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
      - name: ¡Mka Bacon! (Compilar)
        run: |
          cd lineage
          export ALLOW_MISSING_DEPENDENCIES=true
          # Usamos todos los núcleos para el mka
          mka bacon -j$(nproc --all)
